<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
<title id="title">Hyzer July demand readiness visual</title>
<desc id="desc">Abstract launch system showing the July signal connecting creators, operators, partners, and intake.</desc>
<defs>
  <radialGradient id="bg" cx="45%" cy="35%" r="72%"><stop offset="0" stop-color="#164f7d" stop-opacity=".72"/><stop offset=".45" stop-color="#103425" stop-opacity=".56"/><stop offset="1" stop-color="#050807"/></radialGradient>
  <radialGradient id="blueOrb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7dd7ff" stop-opacity=".92"/><stop offset=".45" stop-color="#2479ff" stop-opacity=".28"/><stop offset="1" stop-color="#2479ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="limeOrb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ccff33" stop-opacity=".85"/><stop offset=".5" stop-color="#63f0a4" stop-opacity=".26"/><stop offset="1" stop-color="#63f0a4" stop-opacity="0"/></radialGradient>
  <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#17251f"/><stop offset="1" stop-color="#07100c"/></linearGradient>
  <linearGradient id="stroke" x1="0" x2="1"><stop offset="0" stop-color="#9ddcff" stop-opacity=".7"/><stop offset="1" stop-color="#ccff33" stop-opacity=".8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000" flood-opacity=".38"/></filter>
</defs>
<rect width="920" height="620" rx="54" fill="url(#bg)"/>
<circle cx="190" cy="120" r="180" fill="url(#blueOrb)" filter="url(#blur)"/>
<circle cx="760" cy="470" r="210" fill="url(#limeOrb)" filter="url(#blur)"/>
<circle cx="650" cy="120" r="110" fill="#7dd7ff" opacity=".10" filter="url(#blur)"/>
<g opacity=".22" stroke="#c8f8ff" stroke-width="1">
  <path d="M80 472 C220 398 320 528 470 424 S720 322 840 412" fill="none"/>
  <path d="M90 165 C260 92 342 222 492 154 S704 66 835 140" fill="none"/>
</g>
<g filter="url(#softShadow)">
  <rect x="128" y="132" width="664" height="374" rx="34" fill="rgba(6,10,8,.72)" stroke="rgba(204,255,51,.20)"/>
  <rect x="154" y="158" width="612" height="54" rx="18" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.08)"/>
  <circle cx="186" cy="185" r="7" fill="#75dcff" opacity=".78"/><circle cx="209" cy="185" r="7" fill="#ccff33" opacity=".78"/><circle cx="232" cy="185" r="7" fill="#36513e"/>
  <text x="262" y="191" fill="#dff9ee" font-family="Inter, Arial" font-size="16" font-weight="700">July demand readiness room</text>
  <rect x="182" y="248" width="194" height="178" rx="24" fill="url(#panel)" stroke="rgba(125,215,255,.22)"/>
  <rect x="396" y="248" width="342" height="178" rx="24" fill="rgba(255,255,255,.045)" stroke="rgba(204,255,51,.18)"/>
  <circle cx="279" cy="337" r="58" fill="rgba(125,215,255,.10)" stroke="url(#stroke)" stroke-width="2"/>
  <circle cx="279" cy="337" r="27" fill="rgba(204,255,51,.18)" stroke="rgba(204,255,51,.55)"/>
  <path d="M279 337 L333 296" stroke="#ccff33" stroke-width="4" stroke-linecap="round"/>
  <text x="226" y="458" fill="#f3fff6" font-family="Inter, Arial" font-size="18" font-weight="800">July signal</text>
  <g font-family="Inter, Arial" font-size="15" font-weight="700" fill="#eefbf2">
    <rect x="426" y="278" width="132" height="52" rx="16" fill="rgba(125,215,255,.11)" stroke="rgba(125,215,255,.32)"/><text x="450" y="309">Creators</text>
    <rect x="580" y="278" width="132" height="52" rx="16" fill="rgba(204,255,51,.12)" stroke="rgba(204,255,51,.32)"/><text x="604" y="309">Operators</text>
    <rect x="426" y="352" width="132" height="52" rx="16" fill="rgba(99,240,164,.11)" stroke="rgba(99,240,164,.28)"/><text x="452" y="383">Partners</text>
    <rect x="580" y="352" width="132" height="52" rx="16" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.13)"/><text x="607" y="383">Intake</text>
  </g>
  <path d="M376 337 C412 303 414 304 426 304" stroke="url(#stroke)" stroke-width="2.5" fill="none" opacity=".8"/>
  <path d="M376 337 C438 345 514 352 580 304" stroke="url(#stroke)" stroke-width="2.5" fill="none" opacity=".62"/>
  <path d="M376 337 C414 378 414 378 426 378" stroke="url(#stroke)" stroke-width="2.5" fill="none" opacity=".62"/>
  <path d="M558 378 C570 378 570 378 580 378" stroke="url(#stroke)" stroke-width="2.5" fill="none" opacity=".7"/>
</g>
<g opacity=".86">
  <rect x="88" y="450" width="190" height="74" rx="24" fill="rgba(8,12,10,.68)" stroke="rgba(125,215,255,.20)"/>
  <text x="116" y="482" fill="#ccff33" font-family="Inter, Arial" font-size="13" font-weight="900" letter-spacing="2">EARLY ACCESS</text>
  <text x="116" y="506" fill="#e9fff0" font-family="Inter, Arial" font-size="17" font-weight="800">ready before demand</text>
</g>
</svg>